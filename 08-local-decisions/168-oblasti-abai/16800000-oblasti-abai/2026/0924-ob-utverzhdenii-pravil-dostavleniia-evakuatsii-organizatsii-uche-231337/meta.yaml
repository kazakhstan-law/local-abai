act_code: '231337'
requisite: Решение маслихата области Абай от 24 сентября 2026 года № 41/274-VIII. Зарегистрировано в Министерстве юстиции Республики Казахстан 6 октября 2026 года № 40101
title:
  rus: Об утверждении Правил доставления (эвакуации), организации учета и временного хранения автомобильного транспортного средства, судна, в том числе маломерного судна, задержанного на основании, предусмотренном законодательством Республики Казахстан об административных правонарушениях, на специальных площадках или стоянках, создаваемых по решению местных исполнительных органов области Абай и находящихся в коммунальной собственности
  kaz: Қазақстан Республикасының әкімшілік құқық бұзушылық туралы заңнамасында көзделген негізде, Абай облысының жергілікті атқарушы органдарының шешімі бойынша құрылатын және коммуналдық меншіктегі арнаулы алаңдарда немесе тұрақтарда ұсталған автомобиль көлік құралын, кемені, оның ішінде шағын көлемді кемені жеткізу (эвакуациялау), есепке алуды және уақытша сақтауды ұйымдастыру қағидаларын бекіту туралы
