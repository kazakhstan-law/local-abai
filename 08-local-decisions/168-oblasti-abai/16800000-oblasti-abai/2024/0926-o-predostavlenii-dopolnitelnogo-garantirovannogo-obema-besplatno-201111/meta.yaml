act_code: '201111'
requisite: Решение маслихата области Абай от 26 сентября 2024 года № 19/131-VIII
title:
  rus: О предоставлении дополнительного гарантированного объёма бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, зарегистрированных на территории области Абай при амбулаторном лечении бесплатно
  kaz: Абай облысы аумағында тіркелген, Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша тегін беру туралы
