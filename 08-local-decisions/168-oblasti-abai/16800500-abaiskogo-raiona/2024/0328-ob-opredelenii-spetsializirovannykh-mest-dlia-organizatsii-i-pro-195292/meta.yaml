act_code: '195292'
requisite: Решение Абайского районного маслихата области Абай от 28 марта 2024 года № 14/9-VIII. Зарегистрировано Департаментом юстиции области Абай 4 апреля 2024 года № 246-18
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, нормы их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по Абайскому району
  kaz: Абай ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
