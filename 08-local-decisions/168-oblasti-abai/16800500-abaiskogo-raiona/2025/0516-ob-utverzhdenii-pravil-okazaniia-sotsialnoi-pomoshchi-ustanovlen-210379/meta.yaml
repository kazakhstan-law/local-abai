  title:
    rus: О внесении изменений и дополнения в решение Абайского районного маслихата от 16 мая 2025 года № 27/2-VIII «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Абай аудандық мәслихатының 2025 жылғы 16 мамырдағы № 27/2-VІІІ «Әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
