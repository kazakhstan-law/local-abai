requisite: Решение акима сельского округа имени Койгелды Аухадиева Кокпектинского района области Абай от 26 июня 2025 года № 2
title:
  rus: Об отмене решения акима сельского округа имени Койгелды Аухадиева от 30 октября 2024 года № 1 «Об установлении ограничительных мероприятий в ТОО «Диханшы», Аухадиевского сельского округа, расположенный в селе Черноярка
  kaz: «Көкпекті ауданы Қойгелді Аухадиев атындағы ауылдық округінің Черноярка ауылындағы «Диханшы» жауапкершілігі шектеулі серіктестігіне шектеу іс-шараларын белгілеу туралы» шешімінің күшін жою туралы
