requisite: Решение Курчатовского городского маслихата области Абай от 30 ноября 2023 года № 12/71-VIII. Зарегистрировано Департаментом юстиции области Абай 7 декабря 2023 года № 180-18. Утратило силу решением Курчатовского городского маслихата области Абай от 21 февраля 2024 года № 15/89-VIII (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
