act_code: '179655'
requisite: Решение Урджарского районного маслихата области Абай от 11 апреля 2023 года № 1-17/VIII. Утратило силу решением Урджарского районного маслихата области Абай от 26 декабря 2023 года № 9-222/VIII (вводится в действие с 01.01.2024)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Урджарского района на 2023 год
  kaz: Үржар ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2023 жылға әлеуметтік қолдау шараларын ұсыну туралы
