    kaz: Үржар аудандық мәслихатының 2023 жылғы 27 қазанындағы № 6-145/VIII «Үржар ауданы бойынша шетелдіктер немесе шетелдіктің тұруына ақы төлейтін жеке немесе заңды тұлғалар (шақырушы тарап, туроператор) туристік жарнасын бекіту туралы» шешіміне өзгеріс енгізу туралы
