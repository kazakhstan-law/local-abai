act_code: '221321'
requisite: Решение Бескарагайского районного маслихата области Абай от 23 декабря 2025 года № 36/12-VIII
title:
  rus: Об предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Бескарагайского района на 2026 год
  kaz: 2026 жылға Бесқарағай ауданының ауылдық елдi мекендеріне жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну туралы
