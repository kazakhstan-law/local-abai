act_code: '192901'
requisite: Решение Бескарагайского районного маслихата области Абай от 24 января 2024 года № 13/6-VIII
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходах местного сообщества на территории Бескарагайского района
  kaz: Бесқарағай ауданының аумағында жергілікті қоғамдастықтың бөлек жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
