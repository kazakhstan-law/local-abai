  title:
    rus: О внесении изменения в решение Бескарагайского районного маслихата от 14 ноября 2023 года № 9/15–VIII «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан в Бескарагайском районе»
    kaz: Бесқарағай аудандық мәслихатының 2023 жылғы 14 қарашадағы № 9/15-VIІІ «Бесқарағай ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгеріс енгізу туралы
