  title:
    rus: О внесении изменения в решение маслихата района Жаңасемей от 28 августа 2024 года № 10/51-VІІІ «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан»
    kaz: Жаңасемей аудандық мәслихатының 2024 жылғы 28 тамыз № 10/51-VIIІ «Әлеуметтiк көмек көрсетудiң, оның мөлшерлерiн белгiлеудiң және мұқтаж азаматтардың жекелеген санаттарының тiзбесiн айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
