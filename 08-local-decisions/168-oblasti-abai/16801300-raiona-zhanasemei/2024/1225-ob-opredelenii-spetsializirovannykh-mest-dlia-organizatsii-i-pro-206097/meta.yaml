act_code: '206097'
requisite: Решение маслихата района Жаңасемей области Абай от 25 декабря 2024 года № 13/91-VIII. Зарегистрировано Департаментом юстиции области Абай 8 января 2025 года № 407-18
title:
  rus: Об определении специализированных мест для организации и проведения мирных собраний, порядка их использования, норм их предельной заполняемости, требований к их материально-техническому и организационному обеспечению, границ прилегающих территорий, в которых запрещено проведение пикетирования по району Жаңасемей
  kaz: Жаңасемей ауданы бойынша бейбіт жиналыстарды ұйымдастыру және өткізу үшін арнайы орындарды, оларды пайдалану тәртібін, олардың шекті толу нормаларын, оларды материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды, пикеттеуді өткізуге тыйым салынған іргелес аумақтардың шекараларын айқындау туралы
