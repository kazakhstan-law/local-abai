  code: '221000'
  requisite: Решение маслихата района Жаңасемей области Абай от 29 декабря 2025 года № 25/302-VIII. Зарегистрировано в Министерстве юстиции Республики Казахстан 31 декабря 2025 года № 37783
  title:
    rus: О внесении изменений в решение маслихата района Жаңасемей от 10 сентября 2024 года № 10/59-VIII «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Жаңасемей»
    kaz: Жаңасемей аудандық мәслихатының 2024 жылғы 10 қыркүйектегі № 10/59-VIII «Жаңасемей ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің тәртібі мен мөлшерін бекіту туралы» шешіміне өзгерістер енгізу туралы
