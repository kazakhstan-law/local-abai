act_code: '200774'
requisite: Решение маслихата района Жаңасемей области Абай от 10 сентября 2024 года № 10/59-VIII. Зарегистрировано Департаментом юстиции области Абай 17 сентября 2024 года № 333-18
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Жаңасемей
  kaz: Жаңасемей ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен көрсетілетін коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсетудің Қағидалары мен мөлшерін бекіту туралы
