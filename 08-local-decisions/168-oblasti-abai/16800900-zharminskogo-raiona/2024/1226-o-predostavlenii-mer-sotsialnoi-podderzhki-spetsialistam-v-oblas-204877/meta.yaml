act_code: '204877'
requisite: Решение Жарминского районного маслихата области Абай от 26 декабря 2024 года № 20/374-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселков, сельских округов, за исключением лиц, занимающих руководящие должности, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2025 год
  kaz: Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген басшы лауазымдарды атқаратын адамдарды қоспағанда, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылға арналған әлеуметтік қолдау шараларын ұсыну туралы
