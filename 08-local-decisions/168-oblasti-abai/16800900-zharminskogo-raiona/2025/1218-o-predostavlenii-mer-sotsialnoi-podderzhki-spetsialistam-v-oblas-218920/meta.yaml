act_code: '218920'
requisite: Решение Жарминского районного маслихата области Абай от 18 декабря 2025 года № 32/556-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселков и сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2026 год
  kaz: 2026 жылы Жарма ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кенттер мен ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
