act_code: '180989'
requisite: Решение Жарминского районного маслихата области Абай от 28 апреля 2023 года № 2/17-VIII
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов поселковых, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жарминского района на 2023 год
  kaz: 2023 жылғы Жарма ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, кенттер мен ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
