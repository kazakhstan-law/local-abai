act_code: '180478'
requisite: Решение маслихата города Семей области Абай от 20 апреля 2023 года № 2/13-VIII
title:
  rus: О предоставлении мер социальной поддержки на 2023 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты города Семей
  kaz: Семей қаласының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері апараттарының мемлекеттік қызметшілеріне 2023 жылға арналған әлеуметтік қолдау шараларын ұсыну туралы
