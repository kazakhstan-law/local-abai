act_code: '191062'
requisite: Решение маслихата города Семей области Абай от 22 декабря 2023 года № 16/98-VIII
title:
  rus: О предоставлении мер социальной поддержки на 2024 год специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, ветеринарным специалистам ветеринарных пунктов, осуществляющих деятельность в области ветеринарии, прибывшим для работы и проживания в сельские населенные пункты города Семей
  kaz: Семей қаласының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері апараттарының мемлекеттік қызметшілеріне, ветеринария саласындағы қызметті жүзеге асыратын ветеринария пункттерінің ветеринария мамандарына 2024 жылға арналған әлеуметтік қолдау шараларын ұсыну туралы
