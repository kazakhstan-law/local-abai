  title:
    rus: О внесении изменений в решение маслихата района Ақсуат от 25 декабря 2024 года № 24/11-VIII «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан района Ақсуат»
    kaz: Ақсуат аудандық мәслихатының 2024 жылғы 25 желтоқсандағы № 24/11-VIII «Ақсуат ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
